# ==========================================================
# Duplicate merging
# Reports of the same category within this radius (metres)
# of an open complaint are merged into it. If the phone's GPS
# accuracy is worse, the radius grows up to max-radius-meters.
# ==========================================================
civic.dedup.radius-meters=35
civic.dedup.max-radius-meters=75

# ==========================================================
# Severity analysis
# osm.enabled=true -> look up road class (traffic) and nearby
# schools / hospitals / markets (usage) from OpenStreetMap.
# Set to false for offline development.
# ==========================================================
civic.severity.osm.enabled=true
civic.severity.osm.url=https://overpass-api.de/api/interpreter
civic.severity.recompute-interval-ms=600000
civic.severity.initial-delay-ms=30000
