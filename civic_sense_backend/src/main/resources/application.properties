# ==========================================================
# Duplicate merging
# Reports of the same category within this radius (metres)
# of an open complaint are merged into it. If the phone's GPS
# accuracy is worse, the radius grows up to max-radius-meters.
# ==========================================================
civic.dedup.radius-meters=35
civic.dedup.max-radius-meters=75

# ==========================================================
# Severity analysis
# osm.enabled=true -> look up road class (traffic) and nearby
# schools / hospitals / markets (usage) from OpenStreetMap.
# Set to false for offline development.
# ==========================================================
civic.severity.vehicle-count.csv=${CIVIC_SEVERITY_VEHICLE_COUNT_CSV:}
civic.severity.vehicle-count.reference-daily-volume=${CIVIC_SEVERITY_VEHICLE_COUNT_REFERENCE_DAILY_VOLUME:50000}
civic.severity.road-index=${CIVIC_SEVERITY_ROAD_INDEX:auto}
civic.severity.road-index-refresh-ms=300000
civic.severity.weights=40,25,20,15
civic.severity.thresholds=25,50,80
civic.severity.pothole.weights=30,40,30
civic.severity.pothole.width-reference-cm=100
civic.severity.pothole.depth-reference-cm=15
civic.severity.road.weights=35,25,25,15
civic.severity.impact.weights=45,30,25
civic.severity.recompute-interval-ms=600000
civic.severity.initial-delay-ms=30000
